{% extends 'base.html' %}

{% block title %}Iniciar sesión - Centro Odontologico COMOD{% endblock %}

{% block content %}
<div class="auth-bg py-5">
    <div class="d-flex justify-content-center mb-4">
        <div class="brand-badge">
            <svg class="badge-icon" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
                <rect x="3" y="3" width="18" height="18" rx="5" fill="#0ea5a0"/>
                <path d="M12 7v10M7 12h10" stroke="#ffffff" stroke-width="2" stroke-linecap="round"/>
            </svg>
            <span>Centro Odontologico COMOD</span>
        </div>
    </div>
    <div class="row justify-content-center">
        <div class="col-12 col-md-7 col-lg-5 col-xl-4">
            <div class="card card-auth fade-in-up">
                <div class="card-body p-4 p-md-5">
                    <div class="text-center mb-4">
                        <i class="bi bi-shield-lock text-primary" style="font-size: 3rem;"></i>
                        <h5 class="mt-3 mb-2">Bienvenido</h5>
                        <p class="text-secondary">Accedé al sistema con tu usuario y rol.</p>
                    </div>
                    <form method="post" novalidate>
                        <div class="mb-3">
                            <label for="role" class="form-label">
                                <i class="bi bi-person-badge me-2"></i>Rol
                            </label>
                            <select class="form-select" id="role" name="role" required>
                                <option value="" selected disabled>Seleccione un rol</option>
                                <option value="odontologo">
                                    <i class="bi bi-person-heart"></i> Odontólogo
                                </option>
                                <option value="secretario">
                                    <i class="bi bi-person-gear"></i> Secretario
                                </option>
                            </select>
                        </div>
                        <div class="mb-3">
                            <label for="username" class="form-label">
                                <i class="bi bi-person me-2"></i>Usuario
                            </label>
                            <input type="text" class="form-control" id="username" name="username" placeholder="tu_usuario" required />
                        </div>
                        <div class="mb-4">
                            <label for="password" class="form-label">
                                <i class="bi bi-lock me-2"></i>Contraseña
                            </label>
                            <input type="password" class="form-control" id="password" name="password" placeholder="••••••••" required />
                        </div>
                        <button type="submit" class="btn btn-primary w-100">
                            <i class="bi bi-box-arrow-in-right me-2"></i>Ingresar
                        </button>
                    </form>
                </div>
            </div>
            <p class="text-center text-muted small mt-3">
                <i class="bi bi-shield-check me-1"></i>
                Sistema de gestión para profesionales de la salud dental 
            </p>
        </div>
    </div>
    </div>
{% endblock %}
