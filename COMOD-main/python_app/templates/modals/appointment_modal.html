<!-- Appointment Modal -->
<div class="modal fade" id="appointmentModal" tabindex="-1" aria-labelledby="appointmentModalLabel" aria-hidden="true">
    <div class="modal-dialog modal-xl">
        <div class="modal-content">
            <div class="modal-header bg-primary text-white">
                <h5 class="modal-title" id="appointmentModalLabel">
                    <i class="bi bi-calendar-plus me-2"></i>Nuevo Turno
                </h5>
                <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal" aria-label="Close"></button>
            </div>
            <form id="appointmentForm">
                <div class="modal-body p-4">
                    <!-- Quick Appointment Form -->
                    <div class="row">
                        <div class="col-md-6">
                            <div class="mb-3">
                                <label for="appointmentPatient" class="form-label">
                                    <i class="bi bi-person me-2"></i>Paciente *
                                </label>
                                <select class="form-select form-select-lg" id="appointmentPatient" name="paciente_id" required>
                                    <option value="">Seleccionar paciente...</option>
                                </select>
                            </div>
                        </div>
                        <div class="col-md-6">
                            <div class="mb-3">
                                <label for="appointmentDentist" class="form-label">
                                    <i class="bi bi-person-heart me-2"></i>Odontólogo *
                                </label>
                                <select class="form-select form-select-lg" id="appointmentDentist" name="odontologo_id" required>
                                    <option value="">Seleccionar odontólogo...</option>
                                </select>
                            </div>
                        </div>
                    </div>
                    
                    <div class="row">
                        <div class="col-md-4">
                            <div class="mb-3">
                                <label for="appointmentDate" class="form-label">
                                    <i class="bi bi-calendar-date me-2"></i>Fecha *
                                </label>
                                <select class="form-select form-select-lg" id="appointmentDate" name="fecha" required>
                                    <option value="">Seleccionar fecha...</option>
                                </select>
                                <div class="form-text">
                                    <i class="bi bi-info-circle me-1"></i>
                                    Las fechas se cargan automáticamente según la disponibilidad del médico
                                </div>
                            </div>
                        </div>
                        <div class="col-md-4">
                            <div class="mb-3">
                                <label for="appointmentTime" class="form-label">
                                    <i class="bi bi-clock me-2"></i>Hora *
                                </label>
                                <select class="form-select form-select-lg" id="appointmentTime" name="hora" required>
                                    <option value="">Seleccionar hora...</option>
                                </select>
                                <div class="form-text">
                                    <i class="bi bi-info-circle me-1"></i>
                                    Los horarios se cargan automáticamente según la disponibilidad del médico
                                </div>
                            </div>
                        </div>
                        <div class="col-md-4">
                            <div class="mb-3">
                                <label for="appointmentDuration" class="form-label">
                                    <i class="bi bi-stopwatch me-2"></i>Duración
                                </label>
                                <select class="form-select form-select-lg" id="appointmentDuration" name="duracion">
                                    <option value="15">15 minutos</option>
                                    <option value="30" selected>30 minutos</option>
                                    <option value="45">45 minutos</option>
                                    <option value="60">1 hora</option>
                                    <option value="75">1 hora 15 min</option>
                                    <option value="90">1.5 horas</option>
                                    <option value="105">1 hora 45 min</option>
                                    <option value="120">2 horas</option>
                                    <option value="150">2.5 horas</option>
                                    <option value="180">3 horas</option>
                                    <option value="custom">Duración personalizada</option>
                                </select>
                                <!-- Campo para duración personalizada -->
                                <div id="customDurationField" class="mt-2" style="display: none;">
                                    <div class="input-group">
                                        <input type="number" class="form-control custom-duration-input" id="customDurationMinutes" 
                                               placeholder="Minutos" min="5" max="480" step="5">
                                        <span class="input-group-text">minutos</span>
                                    </div>
                                    <div class="form-text">
                                        <i class="bi bi-info-circle me-1"></i>
                                        Duración personalizada (5-480 minutos)
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                    
                    <div class="row">
                        <div class="col-md-6">
                            <div class="mb-3">
                                <label for="appointmentType" class="form-label">
                                    <i class="bi bi-clipboard-pulse me-2"></i>Tipo de Consulta
                                </label>
                                <select class="form-select form-select-lg" id="appointmentType" name="tipo_consulta">
                                    <option value="">Seleccionar tipo...</option>
                                    <option value="consulta_general">Consulta General</option>
                                    <option value="limpieza">Limpieza Dental</option>
                                    <option value="extraccion">Extracción</option>
                                    <option value="endodoncia">Endodoncia</option>
                                    <option value="ortodoncia">Ortodoncia</option>
                                    <option value="implante">Implante</option>
                                    <option value="control">Control</option>
                                    <option value="urgencia">Urgencia</option>
                                </select>
                            </div>
                        </div>
                        <div class="col-md-6">
                            <div class="mb-3">
                                <label for="appointmentPriority" class="form-label">
                                    <i class="bi bi-exclamation-triangle me-2"></i>Prioridad
                                </label>
                                <select class="form-select form-select-lg" id="appointmentPriority" name="prioridad">
                                    <option value="normal">Normal</option>
                                    <option value="alta">Alta</option>
                                    <option value="urgente">Urgente</option>
                                </select>
                            </div>
                        </div>
                    </div>
                    
                    <div class="mb-3">
                        <label for="appointmentNotes" class="form-label">
                            <i class="bi bi-chat-text me-2"></i>Observaciones
                        </label>
                        <textarea class="form-control" id="appointmentNotes" name="observaciones" rows="3" 
                                  placeholder="Notas adicionales sobre el turno, síntomas, historial relevante..."></textarea>
                    </div>
                    
                    <!-- Quick Actions -->
                    <div class="row mt-4">
                        <div class="col-12">
                            <div class="card bg-light">
                                <div class="card-body">
                                    <h6 class="card-title">
                                        <i class="bi bi-lightning me-2"></i>Acciones Rápidas
                                    </h6>
                                    <div class="d-flex gap-2 flex-wrap">
                                        <button type="button" class="btn btn-outline-primary btn-sm" onclick="setToday()">
                                            <i class="bi bi-calendar-day me-1"></i>Hoy
                                        </button>
                                        <button type="button" class="btn btn-outline-primary btn-sm" onclick="setTomorrow()">
                                            <i class="bi bi-calendar-plus me-1"></i>Mañana
                                        </button>
                                        <button type="button" class="btn btn-outline-success btn-sm" onclick="setNextWeek()">
                                            <i class="bi bi-calendar-week me-1"></i>Próxima Semana
                                        </button>
                                        <button type="button" class="btn btn-outline-warning btn-sm" onclick="setUrgent()">
                                            <i class="bi bi-exclamation-triangle me-1"></i>Urgente
                                        </button>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
                <div class="modal-footer bg-light">
                    <button type="button" class="btn btn-secondary btn-lg" data-bs-dismiss="modal">
                        <i class="bi bi-x-circle me-2"></i>Cancelar
                    </button>
                    <button type="submit" class="btn btn-primary btn-lg">
                        <i class="bi bi-calendar-check me-2"></i>Programar Turno
                    </button>
                </div>
            </form>
        </div>
    </div>
</div>

<style>
/* Estilos para el campo de duración personalizada */
#customDurationField {
    transition: all 0.3s ease;
}

#customDurationField.show {
    animation: slideDown 0.3s ease;
}

@keyframes slideDown {
    from {
        opacity: 0;
        transform: translateY(-10px);
    }
    to {
        opacity: 1;
        transform: translateY(0);
    }
}

.custom-duration-input {
    border-radius: 0.375rem;
    border: 1px solid #ced4da;
}

.custom-duration-input:focus {
    border-color: #0d6efd;
    box-shadow: 0 0 0 0.2rem rgba(13, 110, 253, 0.25);
}
</style>

<script>
// Quick action functions
function setToday() {
    // Con el nuevo sistema, las fechas se cargan dinámicamente
    // Esta función ahora solo limpia el formulario
    document.getElementById('appointmentForm').reset();
    document.getElementById('appointmentTime').innerHTML = '<option value="">Seleccionar hora...</option>';
    document.getElementById('appointmentDate').innerHTML = '<option value="">Seleccionar fecha...</option>';
    
    // Configurar duración estándar para consulta normal
    document.getElementById('appointmentDuration').value = '30';
    
    // Ocultar campo personalizado
    const customField = document.getElementById('customDurationField');
    if (customField) {
        customField.style.display = 'none';
    }
    
    showNotification('Selecciona primero un médico para ver las fechas disponibles', 'info');
}

function setTomorrow() {
    // Con el nuevo sistema, las fechas se cargan dinámicamente
    // Esta función ahora solo limpia el formulario
    document.getElementById('appointmentForm').reset();
    document.getElementById('appointmentTime').innerHTML = '<option value="">Seleccionar hora...</option>';
    document.getElementById('appointmentDate').innerHTML = '<option value="">Seleccionar fecha...</option>';
    
    // Configurar duración estándar para consulta normal
    document.getElementById('appointmentDuration').value = '30';
    
    // Ocultar campo personalizado
    const customField = document.getElementById('customDurationField');
    if (customField) {
        customField.style.display = 'none';
    }
    
    showNotification('Selecciona primero un médico para ver las fechas disponibles', 'info');
}

function setNextWeek() {
    // Con el nuevo sistema, las fechas se cargan dinámicamente
    // Esta función ahora solo limpia el formulario
    document.getElementById('appointmentForm').reset();
    document.getElementById('appointmentTime').innerHTML = '<option value="">Seleccionar hora...</option>';
    document.getElementById('appointmentDate').innerHTML = '<option value="">Seleccionar fecha...</option>';
    
    // Configurar duración estándar para consulta normal
    document.getElementById('appointmentDuration').value = '30';
    
    // Ocultar campo personalizado
    const customField = document.getElementById('customDurationField');
    if (customField) {
        customField.style.display = 'none';
    }
    
    showNotification('Selecciona primero un médico para ver las fechas disponibles', 'info');
}

function setUrgent() {
    // Con el nuevo sistema, las fechas se cargan dinámicamente
    // Esta función ahora solo limpia el formulario y establece prioridad urgente
    document.getElementById('appointmentForm').reset();
    document.getElementById('appointmentTime').innerHTML = '<option value="">Seleccionar hora...</option>';
    document.getElementById('appointmentDate').innerHTML = '<option value="">Seleccionar fecha...</option>';
    document.getElementById('appointmentPriority').value = 'urgente';
    document.getElementById('appointmentType').value = 'urgencia';
    
    // Configurar duración más corta para urgencias
    document.getElementById('appointmentDuration').value = '15';
    
    // Ocultar campo personalizado
    const customField = document.getElementById('customDurationField');
    if (customField) {
        customField.style.display = 'none';
    }
    
    showNotification('Selecciona primero un médico para ver las fechas disponibles', 'info');
}

// Función para cargar fechas disponibles cuando se selecciona un médico
function loadAvailableDates() {
    const odontologoId = document.getElementById('appointmentDentist').value;
    
    console.log('loadAvailableDates called with odontologoId:', odontologoId);
    
    if (!odontologoId) {
        // Limpiar fechas si no hay médico seleccionado
        const dateSelect = document.getElementById('appointmentDate');
        dateSelect.innerHTML = '<option value="">Seleccionar fecha...</option>';
        console.log('No odontologoId, clearing dates');
        return;
    }
    
    // Mostrar loading
    const dateSelect = document.getElementById('appointmentDate');
    dateSelect.innerHTML = '<option value="">Cargando fechas disponibles...</option>';
    dateSelect.disabled = true;
    
    const apiUrl = `/api/disponibilidad/${odontologoId}/fechas`;
    console.log('Making request to:', apiUrl);
    
    // Cargar fechas disponibles
    fetch(apiUrl)
        .then(response => {
            console.log('Response status:', response.status);
            if (!response.ok) {
                throw new Error(`HTTP ${response.status}: ${response.statusText}`);
            }
            return response.json();
        })
        .then(data => {
            console.log('API response:', data);
            console.log('API response structure:', JSON.stringify(data, null, 2));
            
            if (data.success) {
                dateSelect.innerHTML = '<option value="">Seleccionar fecha...</option>';
                
                // La API devuelve directamente data.fechas, no data.data.fechas
                const fechas = data.fechas;
                
                if (!fechas || fechas.length === 0) {
                    dateSelect.innerHTML = '<option value="">No hay fechas disponibles</option>';
                    console.log('No dates available for this doctor');
                } else {
                    console.log('Adding', fechas.length, 'dates to select');
                    fechas.forEach(fecha => {
                        const option = document.createElement('option');
                        option.value = fecha.fecha;
                        option.textContent = fecha.fecha_display;
                        dateSelect.appendChild(option);
                    });
                }
            } else {
                dateSelect.innerHTML = '<option value="">Error al cargar fechas</option>';
                console.error('API returned error:', data.message);
            }
        })
        .catch(error => {
            console.error('Fetch error:', error);
            dateSelect.innerHTML = '<option value="">Error al cargar fechas</option>';
        })
        .finally(() => {
            dateSelect.disabled = false;
        });
}

// Función para cargar horarios disponibles
function loadAvailableTimes() {
    const fecha = document.getElementById('appointmentDate').value;
    const odontologoId = document.getElementById('appointmentDentist').value;
    
    console.log('loadAvailableTimes called with:', { fecha, odontologoId });
    
    if (!fecha || !odontologoId) {
        // Limpiar opciones si faltan datos
        const timeSelect = document.getElementById('appointmentTime');
        timeSelect.innerHTML = '<option value="">Seleccionar hora...</option>';
        console.log('Missing fecha or odontologoId, clearing options');
        return;
    }
    
    // Mostrar loading
    const timeSelect = document.getElementById('appointmentTime');
    timeSelect.innerHTML = '<option value="">Cargando horarios disponibles...</option>';
    timeSelect.disabled = true;
    
    const apiUrl = `/api/disponibilidad/${odontologoId}/${fecha}`;
    console.log('Making request to:', apiUrl);
    
    // Cargar slots disponibles
    fetch(apiUrl)
        .then(response => {
            console.log('Response status:', response.status);
            if (!response.ok) {
                throw new Error(`HTTP ${response.status}: ${response.statusText}`);
            }
            return response.json();
        })
        .then(data => {
            console.log('API response:', data);
            if (data.success) {
                timeSelect.innerHTML = '<option value="">Seleccionar hora...</option>';
                
                // La API devuelve directamente data.slots, no data.data.slots
                const slots = data.slots;
                
                if (!slots || slots.length === 0) {
                    timeSelect.innerHTML = '<option value="">No hay horarios disponibles</option>';
                    console.log('No slots available for this date');
                } else {
                    console.log('Adding', slots.length, 'slots to select');
                    slots.forEach(slot => {
                        const option = document.createElement('option');
                        option.value = slot.hora_inicio;
                        option.textContent = `${slot.hora_inicio} - ${slot.hora_fin}`;
                        timeSelect.appendChild(option);
                    });
                }
            } else {
                timeSelect.innerHTML = '<option value="">Error al cargar horarios</option>';
                console.error('API returned error:', data.message);
            }
        })
        .catch(error => {
            console.error('Fetch error:', error);
            timeSelect.innerHTML = '<option value="">Error al cargar horarios</option>';
        })
        .finally(() => {
            timeSelect.disabled = false;
        });
}

// Función para configurar event listeners
function setupAppointmentModalListeners() {
    console.log('Setting up appointment modal listeners...');
    
    const dentistSelect = document.getElementById('appointmentDentist');
    const dateInput = document.getElementById('appointmentDate');
    
    console.log('Found elements:', {
        dentistSelect: !!dentistSelect,
        dateInput: !!dateInput
    });
    
    if (dentistSelect) {
        // Remover listeners existentes para evitar duplicados
        dentistSelect.removeEventListener('change', loadAvailableDates);
        
        dentistSelect.addEventListener('change', function() {
            console.log('Dentist changed, loading available dates...');
            console.log('Selected dentist ID:', this.value);
            loadAvailableDates();
            // Limpiar horarios cuando cambia el médico
            const timeSelect = document.getElementById('appointmentTime');
            timeSelect.innerHTML = '<option value="">Seleccionar hora...</option>';
        });
        console.log('Dentist event listener added');
    } else {
        console.error('appointmentDentist element not found');
    }
    
    if (dateInput) {
        // Remover listeners existentes para evitar duplicados
        dateInput.removeEventListener('change', loadAvailableTimes);
        
        dateInput.addEventListener('change', function() {
            console.log('Date changed, loading available times...');
            console.log('Selected date:', this.value);
            loadAvailableTimes();
        });
        console.log('Date event listener added');
    } else {
        console.error('appointmentDate element not found');
    }
}

// Función para manejar duración personalizada
function setupDurationHandler() {
    const durationSelect = document.getElementById('appointmentDuration');
    const customField = document.getElementById('customDurationField');
    const customInput = document.getElementById('customDurationMinutes');
    
    if (durationSelect && customField && customInput) {
        durationSelect.addEventListener('change', function() {
            if (this.value === 'custom') {
                customField.style.display = 'block';
                customField.classList.add('show');
                customInput.required = true;
                customInput.focus();
            } else {
                customField.classList.remove('show');
                setTimeout(() => {
                    customField.style.display = 'none';
                }, 300);
                customInput.required = false;
                customInput.value = '';
            }
        });
        
        // Validar duración personalizada
        customInput.addEventListener('input', function() {
            const value = parseInt(this.value);
            if (value < 5) {
                this.setCustomValidity('La duración mínima es 5 minutos');
            } else if (value > 480) {
                this.setCustomValidity('La duración máxima es 480 minutos (8 horas)');
            } else {
                this.setCustomValidity('');
            }
        });
    }
}

// Función para obtener la duración seleccionada
function getSelectedDuration() {
    const durationSelect = document.getElementById('appointmentDuration');
    const customInput = document.getElementById('customDurationMinutes');
    
    if (durationSelect.value === 'custom') {
        return customInput.value || '30'; // Default a 30 si está vacío
    }
    return durationSelect.value;
}

// Función para configurar el envío del formulario
function setupFormSubmission() {
    const form = document.getElementById('appointmentForm');
    if (form) {
        form.addEventListener('submit', function(e) {
            // Actualizar el valor de duración antes de enviar
            const durationSelect = document.getElementById('appointmentDuration');
            if (durationSelect.value === 'custom') {
                const customInput = document.getElementById('customDurationMinutes');
                if (customInput.value) {
                    durationSelect.value = customInput.value;
                } else {
                    e.preventDefault();
                    alert('Por favor ingresa una duración personalizada válida');
                    return false;
                }
            }
        });
    }
}

// Set minimum date when modal opens
document.addEventListener('DOMContentLoaded', function() {
    console.log('DOM loaded, setting up modal...');
    
    // Configurar manejador de duración
    setupDurationHandler();
    
    // Configurar envío del formulario
    setupFormSubmission();
    
    const appointmentModal = document.getElementById('appointmentModal');
    if (appointmentModal) {
        appointmentModal.addEventListener('show.bs.modal', function() {
            console.log('Modal opening...');
            
            // Limpiar formulario
            document.getElementById('appointmentForm').reset();
            document.getElementById('appointmentTime').innerHTML = '<option value="">Seleccionar hora...</option>';
            document.getElementById('appointmentDate').innerHTML = '<option value="">Seleccionar fecha...</option>';
            
            // Ocultar campo personalizado
            const customField = document.getElementById('customDurationField');
            if (customField) {
                customField.style.display = 'none';
            }
            
            // Configurar event listeners cuando se abre el modal
            setTimeout(setupAppointmentModalListeners, 100);
        });
        
        // También configurar listeners inmediatamente si el modal ya existe
        setTimeout(setupAppointmentModalListeners, 500);
    } else {
        console.error('appointmentModal element not found');
    }
});
</script>
