<!-- Patient Modal -->
<div class="modal fade" id="patientModal" tabindex="-1" aria-labelledby="patientModalLabel" aria-hidden="true">
    <div class="modal-dialog modal-lg">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title" id="patientModalLabel">
                    <i class="bi bi-person-plus me-2"></i>Nuevo Paciente
                </h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
            </div>
            <form id="patientForm">
                <div class="modal-body">
                    <div class="row">
                        <div class="col-md-6">
                            <div class="mb-3">
                                <label for="patientName" class="form-label">Nombre Completo *</label>
                                <input type="text" class="form-control" id="patientName" name="nombre" required>
                            </div>
                        </div>
                        <div class="col-md-6">
                            <div class="mb-3">
                                <label for="patientDNI" class="form-label">DNI *</label>
                                <input type="text" class="form-control" id="patientDNI" name="dni" required>
                            </div>
                        </div>
                    </div>
                    <div class="row">
                        <div class="col-md-6">
                            <div class="mb-3">
                                <label for="patientBirthDate" class="form-label">Fecha de Nacimiento</label>
                                <input type="text" class="form-control" id="patientBirthDate" name="fecha_nacimiento" 
                                       placeholder="DD/MM/AAAA" 
                                       maxlength="10"
                                       pattern="\d{2}/\d{2}/\d{4}" 
                                       title="Formato: DD/MM/AAAA">
                                <div class="form-text">Ingresa solo los números, las barras se agregan automáticamente</div>
                            </div>
                        </div>
                        <div class="col-md-6">
                            <div class="mb-3">
                                <label for="patientPhone" class="form-label">Teléfono</label>
                                <input type="tel" class="form-control" id="patientPhone" name="telefono">
                            </div>
                        </div>
                    </div>
                    <div class="row">
                        <div class="col-md-6">
                            <div class="mb-3">
                                <label for="patientEmail" class="form-label">Email</label>
                                <input type="email" class="form-control" id="patientEmail" name="email">
                            </div>
                        </div>
                        <div class="col-md-6">
                            <div class="mb-3">
                                <label for="patientAddress" class="form-label">Dirección</label>
                                <input type="text" class="form-control" id="patientAddress" name="direccion">
                            </div>
                        </div>
                    </div>
                    <div class="row">
                        <div class="col-md-6">
                            <div class="mb-3">
                                <label for="patientEmergencyContact" class="form-label">Contacto de Emergencia</label>
                                <input type="text" class="form-control" id="patientEmergencyContact" name="contacto_emergencia">
                            </div>
                        </div>
                        <div class="col-md-6">
                            <div class="mb-3">
                                <label for="patientEmergencyPhone" class="form-label">Teléfono de Emergencia</label>
                                <input type="tel" class="form-control" id="patientEmergencyPhone" name="telefono_emergencia">
                            </div>
                        </div>
                    </div>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancelar</button>
                    <button type="submit" class="btn btn-primary">
                        <i class="bi bi-save me-2"></i>Guardar Paciente
                    </button>
                </div>
            </form>
        </div>
    </div>
</div>

<script>
// Auto-formatear fecha de nacimiento con barras
document.addEventListener('DOMContentLoaded', function() {
    const birthDateInput = document.getElementById('patientBirthDate');
    
    if (birthDateInput) {
        birthDateInput.addEventListener('input', function(e) {
            let value = e.target.value.replace(/\D/g, ''); // Solo números
            
            // Limitar a 8 dígitos (DDMMAAAA)
            if (value.length > 8) {
                value = value.substring(0, 8);
            }
            
            // Agregar barras automáticamente
            if (value.length >= 2) {
                value = value.substring(0, 2) + '/' + value.substring(2);
            }
            if (value.length >= 5) {
                value = value.substring(0, 5) + '/' + value.substring(5);
            }
            
            e.target.value = value;
        });
        
        // Permitir borrar con backspace
        birthDateInput.addEventListener('keydown', function(e) {
            if (e.key === 'Backspace') {
                let value = e.target.value;
                // Si está en una posición de barra, borrar también la barra
                if (value.length === 3 || value.length === 6) {
                    e.target.value = value.substring(0, value.length - 1);
                }
            }
        });
    }
});
</script>
